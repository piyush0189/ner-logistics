services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
      network: host
    container_name: pragyaan-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      network: host
    container_name: pragyaan-frontend
    ports:
      - "5173:5173"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
